<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Not found</title>
		<style>
			/* Self contained on purpose: an error page that pulls in the
			   application's stylesheet has nothing to show when the
			   application is what is missing. */
			body
			{
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f2f5f8;
				color: #253746;
				font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
			}

			main
			{
				padding: 2rem 2.5rem;
				border: 1px solid #d9e0e7;
				border-radius: 4px;
				background: #ffffff;
				text-align: center;
			}

			h1
			{
				margin: 0 0 0.5rem;
				font-size: 1.25rem;
			}

			p
			{
				margin: 0;
				color: #74838f;
			}

			a
			{
				color: #1e87f0;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>404 Not found</h1>
			<p>There is no page here. <a href="/">The tables</a> are.</p>
		</main>
	</body>
</html>
