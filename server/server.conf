upstream asyncdb {
	server 127.0.0.1:8080;
	keepalive 64;
}

# A key travels percent-encoded in the path, so /asyncdb is stripped from $request_uri, which is
# the target as it was sent. Rewriting instead would work on the decoded path, and a key holding a
# %2F would reach the server as a real slash and be a different route. $request_uri carries the
# query string too, and proxy_pass does not append one of its own when it is given a variable.
map $request_uri $asyncdb_target {
	"~^/asyncdb/+(?<rest>.*)$"	"/$rest";
	default				"/";
}

server {
	listen       80 default_server;
	listen       [::]:80;
	server_name  _;
	root         /usr/share/nginx/html;

	# A key is 4 KiB and travels percent encoded, so three characters to the byte at worst, and
	# the request line carrying one is twelve. nginx reads a header into 8 KiB buffers by default
	# and answers 414 to anything longer, which is a documented key that never reaches the
	# database — the same limit, and the same size, that the parser in server::session sets.
	large_client_header_buffers 4 20k;

	# The container's own stdout, so a request the proxy saw is in `docker logs` beside what the
	# database itself printed. It is the stdout the master was started with, taken before it
	# daemonises and inherited by every worker, so nothing here reopens it.
	access_log /dev/stdout;

	location /asyncdb {
		proxy_pass http://asyncdb$asyncdb_target;

		# The body of a record write is the value, and a value is 16 MiB. nginx allows 1 MiB by
		# default, which would refuse fifteen sixteenths of the documented range with an HTML
		# page the API never mentions.
		client_max_body_size 16m;

		proxy_http_version 1.1;
		proxy_set_header Connection "";

		# A request marked as forwarded is served where it lands rather than sent on to the
		# node that owns the key, so a client that set the header itself would be answered by
		# whichever node the load balancer picked. Only another node may say this, and another
		# node talks to 8080 and not to here, so it is cleared on the way past.
		proxy_set_header X-Asyncdb-Forwarded "";

		# proxy_intercept_errors is off, so the errors the database itself answers with travel
		# untouched, JSON body and all. These are the ones nginx makes when there is no database
		# behind it to answer, and the API says every error carries the same body, so they are
		# that body too. The page is a static file rather than a `return` because a `return`
		# would name one status for all four: served as a file, a 502 stays a 502.
		error_page 500 502 503 504 /50x.json;

		# And a body over the limit is refused here rather than proxied, so this is the one error
		# nginx answers that the server would have answered the same way: 413 value_too_large,
		# with the message record::parse_record would have given it.
		error_page 413 /413.json;
	}

	# Anything not under /asyncdb is the UI, and nothing static can answer 502, so the two error
	# pages divide the same way the server does: JSON for the API, a page for the browser.
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	location = /50x.json {
		internal;
	}

	location = /413.json {
		internal;
	}
}
