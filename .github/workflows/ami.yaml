name: Build AMIs

# Run by hand from the Actions tab, and by nothing else. What it bakes is the first boot of
# the two tiers `cloudformation.json` stands up: the packages a database instance downloads
# before it can talk to ECR, and the etcd image three instances in private subnets cannot pull for themselves
# at the moment they are trying to find each other. The asyncdb image is in neither — a
# database instance still pulls the tag `/asyncdb/version` names — so an image outlives
# every release and is rebuilt only when a dependency moves.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which AMIs to build
        type: choice
        options:
          - both
          - database
          - etcd
        default: both
      instance-type:
        description: The instance type to bake on
        type: string
        default: t3.micro
      subnet-id:
        description: The subnet to bake in, or empty for the default VPC
        type: string
        default: ''

env:
  AWS_REGION: eu-west-2

jobs:

  bake:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        role: ${{ inputs.target == 'both' && fromJSON('["database", "etcd"]') || fromJSON(format('["{0}"]', inputs.target)) }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Install Packer
      uses: hashicorp/setup-packer@main
      with:
        version: latest

    - name: Initialise and validate the template
      run: |
        packer init ami/asyncdb.pkr.hcl
        packer validate -only='${{ matrix.role }}.*' ami/asyncdb.pkr.hcl

    - name: Bake the image
      run: |
        packer build \
          -only='${{ matrix.role }}.*' \
          -var region=$AWS_REGION \
          -var instance_type='${{ inputs.instance-type }}' \
          -var subnet_id='${{ inputs.subnet-id }}' \
          -var commit=${{ github.sha }} \
          -var run_id=${{ github.run_id }} \
          ami/asyncdb.pkr.hcl

    - name: Record the image in SSM
      run: |
        IMAGE=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)

        case "$IMAGE" in
          ami-*) ;;
          *)
            echo "The manifest names no image."
            cat manifest.json
            exit 1
            ;;
        esac

        aws ssm put-parameter \
          --name /asyncdb/ami/${{ matrix.role }} \
          --type String \
          --value $IMAGE \
          --overwrite

        echo "\`$IMAGE\` is now \`/asyncdb/ami/${{ matrix.role }}\`." >> $GITHUB_STEP_SUMMARY

    - name: Sweep up a builder Packer did not
      if: always()
      run: |
        BUILDERS=$(aws ec2 describe-instances \
          --filters "Name=tag:asyncdb:run,Values=${{ github.run_id }}" \
                    "Name=instance-state-name,Values=pending,running,stopping,stopped" \
          --query 'Reservations[].Instances[].InstanceId' --output text)

        if [ -n "$BUILDERS" ]
        then
          echo "Packer left $BUILDERS behind."
          aws ec2 terminate-instances --instance-ids $BUILDERS \
            --query 'TerminatingInstances[].CurrentState.Name' --output text
        fi
