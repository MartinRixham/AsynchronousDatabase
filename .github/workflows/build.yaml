name: Build and Push Docker image

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2 

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker image
      run: docker build -t asyncdb:latest .

    - name: Read version
      id: get_version
      run: |
        VERSION=$(cat version)
        echo "Version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Check if version exists in ECR
      id: check_version
      run: |
        if aws ecr describe-images \
          --repository-name asyncdb \
          --image-ids imageTag=$VERSION \
          --query 'imageDetails[0].imageTags[0]'
        then
          echo "Image version $VERSION already exists in ECR."
          echo "publish=false" >> $GITHUB_OUTPUT
        else
          echo "publish=true" >> $GITHUB_OUTPUT
        fi

    - name: Tag and push Docker image to ECR
      if: steps.check_version.outputs.publish == 'true'
      run: |
        IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/asyncdb:$VERSION
        docker tag asyncdb:latest $IMAGE_URI
        docker push $IMAGE_URI

    - name: Record published version in SSM
      if: steps.check_version.outputs.publish == 'true'
      run: |
        aws ssm put-parameter \
          --name /asyncdb/version \
          --type String \
          --value "$VERSION" \
          --overwrite

    - name: Tag Git repo with version
      if: steps.check_version.outputs.publish == 'true'
      run: |
        git fetch --tags
        if ! git show -s $VERSION; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
        fi

    - name: Deploy the stack
      id: deploy
      run: |
        make create-stack
        echo "created=true" >> $GITHUB_OUTPUT
        aws cloudformation wait stack-create-complete --stack-name asyncdb
        URL=$(aws cloudformation describe-stacks \
          --stack-name asyncdb \
          --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" \
          --output text)
        echo "Stack is at $URL"
        echo "URL=$URL" >> $GITHUB_ENV

    - name: Wait for the cluster to come up
      run: |
        for attempt in $(seq 1 90); do
          nodes=$(curl -fsS --max-time 10 "$URL/asyncdb/health" | jq '.nodes | length') || nodes=0
          if [ "${nodes:-0}" = "3" ]; then
            echo "Three nodes answering after $attempt attempts."
            exit 0
          fi
          echo "Attempt $attempt: ${nodes:-0} of 3 nodes."
          sleep 10
        done
        echo "The cluster did not reach three nodes."
        exit 1

    - name: Install newman
      run: npm install -g newman

    - name: Run the API collection
      run: |
        newman run api/asyncdb.postman_collection.json \
          -e api/asyncdb.aws.postman_environment.json \
          --env-var baseUrl=$URL/asyncdb \
          --env-var node1=$URL/asyncdb \
          --env-var node2=$URL/asyncdb \
          --env-var node3=$URL/asyncdb

    - name: Stack events
      if: failure() && steps.deploy.outputs.created == 'true'
      run: make describe-stack

    - name: Tear down the stack
      if: always() && steps.deploy.outputs.created == 'true'
      run: |
        make delete-stack
        aws cloudformation wait stack-delete-complete --stack-name asyncdb
