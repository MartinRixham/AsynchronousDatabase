name: Build and Push Docker image

on:
  push:
    branches: [ main, master ]

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      verify: ${{ steps.check_verified.outputs.verify }}
      version: ${{ steps.get_version.outputs.version }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2 

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: docker build -t asyncdb:latest .

    - name: Read version
      id: get_version
      run: |
        VERSION=$(cat version)
        echo "Version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if version exists in ECR
      id: check_version
      run: |
        aws ecr describe-repositories --repository-name asyncdb > /dev/null 2>&1 \
          || aws ecr create-repository --repository-name asyncdb > /dev/null

        if aws ecr describe-images \
          --repository-name asyncdb \
          --image-ids imageTag=$VERSION \
          --query 'imageDetails[0].imageTags[0]'
        then
          echo "Image version $VERSION already exists in ECR."
          echo "publish=false" >> $GITHUB_OUTPUT
        else
          echo "publish=true" >> $GITHUB_OUTPUT
        fi

    # The deploy gate, and deliberately not the release gate above it. That one asks whether the
    # image is in ECR, and the image is pushed before a single test has run against a stack — so a
    # published version is not a version that passed, and reusing `publish` here would skip the
    # deploy for a version whose first run went red.
    #
    # This asks the other question: has this version already had a build that went green all the
    # way through the chaos suite? A `verified/$VERSION` tag is the answer, pushed at the end of
    # that run and nowhere else — so a version that fails is retried on every push until it
    # passes, and a version that passed is never stood up again.
    #
    # The remote is asked rather than the local repository, because the checkout is one commit
    # deep and fetches no tags. `--exit-code` is 0 when the ref is there and 2 when it is not; a
    # remote that cannot be reached at all is 128, which reads here as "not verified" and deploys.
    # That is the safe direction: this gate fails towards spending money, never towards skipping
    # a suite that should have run.
    - name: Check whether this version has passed already
      id: check_verified
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/verified/$VERSION" > /dev/null 2>&1
        then
          echo "Version $VERSION has a passing build already. Deploying nothing."
          echo "verify=false" >> $GITHUB_OUTPUT
        else
          echo "Version $VERSION has no passing build yet."
          echo "verify=true" >> $GITHUB_OUTPUT
        fi

    - name: Tag and push Docker image to ECR
      if: steps.check_version.outputs.publish == 'true'
      run: |
        IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/asyncdb:$VERSION
        docker tag asyncdb:latest $IMAGE_URI
        docker push $IMAGE_URI

    - name: Record published version in SSM
      if: steps.check_version.outputs.publish == 'true'
      run: |
        aws ssm put-parameter \
          --name /asyncdb/version \
          --type String \
          --value "$VERSION" \
          --overwrite

    - name: Tag Git repo with version
      if: steps.check_version.outputs.publish == 'true'
      run: |
        git fetch --tags
        if ! git show -s $VERSION; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
        fi

    - name: Mirror etcd into ECR
      run: |
        ETCD_VERSION=$(cat etcd-version)
        REGISTRY=${{ steps.ecr-login.outputs.registry }}

        aws ecr describe-repositories --repository-name etcd > /dev/null 2>&1 \
          || aws ecr create-repository --repository-name etcd > /dev/null

        if aws ecr describe-images \
          --repository-name etcd \
          --image-ids imageTag=$ETCD_VERSION > /dev/null 2>&1
        then
          echo "etcd:$ETCD_VERSION is mirrored already."
        else
          echo "Mirroring quay.io/coreos/etcd:$ETCD_VERSION."
          docker pull quay.io/coreos/etcd:$ETCD_VERSION
          docker tag quay.io/coreos/etcd:$ETCD_VERSION $REGISTRY/etcd:$ETCD_VERSION
          docker push $REGISTRY/etcd:$ETCD_VERSION
        fi

        aws ssm put-parameter \
          --name /asyncdb/etcd \
          --type String \
          --value "$ETCD_VERSION" \
          --overwrite

  # Everything that needs a running cluster, in a job of its own so that one condition gates all
  # of it: a step added here is gated by being here, rather than by somebody remembering to
  # repeat the condition on it. The whole job is the expensive half of the pipeline — nine
  # instances, an ALB and the FIS experiments — and it runs once per version rather than once per
  # push.
  deploy-and-verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.verify == 'true'

    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Deploy the stack
      id: deploy
      run: |
        make create-stack
        echo "created=true" >> $GITHUB_OUTPUT
        aws cloudformation wait stack-create-complete --stack-name asyncdb
        URL=$(aws cloudformation describe-stacks \
          --stack-name asyncdb \
          --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" \
          --output text)
        echo "Stack is at $URL"
        echo "URL=$URL" >> $GITHUB_ENV

    - name: Wait for the cluster to come up
      run: |
        for attempt in $(seq 1 90); do
          nodes=$(curl -fsS --max-time 10 "$URL/asyncdb/health" | jq '.nodes | length') || nodes=0
          if [ "${nodes:-0}" = "6" ]; then
            echo "Six nodes answering after $attempt attempts."
            exit 0
          fi
          echo "Attempt $attempt: ${nodes:-0} of 6 nodes."
          sleep 10
        done
        echo "The cluster did not reach six nodes."
        exit 1

    - name: Install newman
      run: npm install -g newman

    - name: Run the API collection
      run: |
        newman run api/asyncdb.postman_collection.json \
          -e api/asyncdb.aws.postman_environment.json \
          --env-var baseUrl=$URL/asyncdb \
          --env-var node1=$URL/asyncdb \
          --env-var node2=$URL/asyncdb \
          --env-var node3=$URL/asyncdb

    - name: Install the browser tests
      working-directory: automation
      run: |
        npm install
        npx playwright install --with-deps chromium

    - name: Run the browser tests
      working-directory: automation
      run: ASYNCDB_URL=$URL npm test

    - name: The report of a failed browser run
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: automation/playwright-report/
        retention-days: 7

    # Two runs, because size and count measure different things and neither subsumes the other.
    # Many small requests are the throughput and the percentiles — two thousand of them is a
    # distribution worth reading. A few large ones are the path a big value takes: spooled to disk
    # by nginx, read whole by the parser, and fanned out to the copy in every zone, which is a load
    # the deployment could not carry at all until both limits were raised to the documented 16 MiB.
    # The second run drops and recreates the table, so it starts on an empty one as the first did.
    - name: Run the load tests
      env:
        THREADS: '8'
      run: |
        export BASE=$URL/asyncdb

        REQUESTS=250 VALUE_BYTES=1024 perf/write.sh
        REQUESTS=250 URL=$BASE/table/perf_load/key/0 perf/read.sh

        # 8 × 32 of two megabytes is half a gigabyte in each direction, from a runner loading
        # eu-west-2 over the internet. Raising the size is what brings the count down.
        REQUESTS=32 VALUE_BYTES=2097152 perf/write.sh
        REQUESTS=32 URL=$BASE/table/perf_load/key/0 perf/read.sh

    - name: The chaos role
      id: chaos_role
      if: steps.deploy.outputs.created == 'true'
      run: |
        make create-chaos-stack
        echo "created=true" >> $GITHUB_OUTPUT
        aws cloudformation wait stack-create-complete --stack-name asyncdb-chaos

    - name: Validate the experiment templates
      run: chaos/validate.sh

    - name: Run the chaos suite
      run: chaos/run.sh

    # The last thing before the teardown, and it carries no condition of its own: a step with no
    # `if` runs only when every step before it succeeded, which is exactly what this records.
    # From here on a push that does not bump `version` skips this whole job.
    #
    # A tag rather than anything held in AWS, so that what the pipeline knows about a version is
    # in the repository beside the version itself: `git tag -l 'verified/*'` is the list of
    # versions that have been through the suite, and deleting one is how a version is made to go
    # through it again. It needs no credentials of its own — `actions/checkout` persisted the
    # ones this pushes on — and no race, because the workflow's concurrency group serialises it.
    - name: Record that this version passed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "verified/$VERSION"
        git push origin "verified/$VERSION"

        echo "Version $VERSION has passed. Subsequent pushes on it will deploy nothing."

    - name: Tear down the chaos role
      if: always() && steps.chaos_role.outputs.created == 'true'
      run: |
        make delete-chaos-stack
        aws cloudformation wait stack-delete-complete --stack-name asyncdb-chaos

    - name: Stack events
      if: failure() && steps.deploy.outputs.created == 'true'
      run: make describe-stack

    - name: What the nodes say for themselves
      if: failure() && steps.deploy.outputs.created == 'true'
      run: |
        set +e

        echo "The membership the load balancer answers with:"
        curl -fsS --max-time 10 "$URL/asyncdb/health" | jq .

        aws ec2 describe-instances \
          --filters "Name=tag:aws:cloudformation:stack-name,Values=asyncdb" \
                    "Name=instance-state-name,Values=running" \
          --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress,Placement.AvailabilityZone]' \
          --output text > instances.txt

        echo "The instances the stack is running:"
        cat instances.txt

        while read -r id ip zone; do
          [ -n "$id" ] || continue

          echo "::group::$id $ip $zone"

          command=$(aws ssm send-command \
            --instance-ids "$id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["docker ps -a","docker logs --tail 200 $(docker ps --format \"{{.ID}} {{.Image}}\" | awk \"/asyncdb/{print \\$1; exit}\") 2>&1"]' \
            --query 'Command.CommandId' --output text)

          if [ -n "$command" ]; then
            aws ssm wait command-executed --command-id "$command" --instance-id "$id" 2> /dev/null
            aws ssm get-command-invocation --command-id "$command" --instance-id "$id" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
          fi

          echo "--- console ---"
          aws ec2 get-console-output --instance-id "$id" --output text | tail -n 60

          echo "::endgroup::"
        done < instances.txt

        exit 0

    - name: Tear down the stack
      if: always() && steps.deploy.outputs.created == 'true'
      run: |
        make delete-stack
        aws cloudformation wait stack-delete-complete --stack-name asyncdb
