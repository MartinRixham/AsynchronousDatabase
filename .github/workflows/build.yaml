name: Build and Push Docker image

on:
  push:
    branches: [ main, master ]

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2 

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: docker build -t asyncdb:latest .

    - name: Read version
      id: get_version
      run: |
        VERSION=$(cat version)
        echo "Version: $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Check if version exists in ECR
      id: check_version
      run: |
        aws ecr describe-repositories --repository-name asyncdb > /dev/null 2>&1 \
          || aws ecr create-repository --repository-name asyncdb > /dev/null

        if aws ecr describe-images \
          --repository-name asyncdb \
          --image-ids imageTag=$VERSION \
          --query 'imageDetails[0].imageTags[0]'
        then
          echo "Image version $VERSION already exists in ECR."
          echo "publish=false" >> $GITHUB_OUTPUT
        else
          echo "publish=true" >> $GITHUB_OUTPUT
        fi

    - name: Tag and push Docker image to ECR
      if: steps.check_version.outputs.publish == 'true'
      run: |
        IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/asyncdb:$VERSION
        docker tag asyncdb:latest $IMAGE_URI
        docker push $IMAGE_URI

    - name: Record published version in SSM
      if: steps.check_version.outputs.publish == 'true'
      run: |
        aws ssm put-parameter \
          --name /asyncdb/version \
          --type String \
          --value "$VERSION" \
          --overwrite

    - name: Tag Git repo with version
      if: steps.check_version.outputs.publish == 'true'
      run: |
        git fetch --tags
        if ! git show -s $VERSION; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
        fi

    - name: Mirror etcd into ECR
      run: |
        ETCD_VERSION=$(cat etcd-version)
        REGISTRY=${{ steps.ecr-login.outputs.registry }}

        aws ecr describe-repositories --repository-name etcd > /dev/null 2>&1 \
          || aws ecr create-repository --repository-name etcd > /dev/null

        if aws ecr describe-images \
          --repository-name etcd \
          --image-ids imageTag=$ETCD_VERSION > /dev/null 2>&1
        then
          echo "etcd:$ETCD_VERSION is mirrored already."
        else
          echo "Mirroring quay.io/coreos/etcd:$ETCD_VERSION."
          docker pull quay.io/coreos/etcd:$ETCD_VERSION
          docker tag quay.io/coreos/etcd:$ETCD_VERSION $REGISTRY/etcd:$ETCD_VERSION
          docker push $REGISTRY/etcd:$ETCD_VERSION
        fi

        aws ssm put-parameter \
          --name /asyncdb/etcd \
          --type String \
          --value "$ETCD_VERSION" \
          --overwrite

    - name: Deploy the stack
      id: deploy
      run: |
        make create-stack
        echo "created=true" >> $GITHUB_OUTPUT
        aws cloudformation wait stack-create-complete --stack-name asyncdb
        URL=$(aws cloudformation describe-stacks \
          --stack-name asyncdb \
          --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" \
          --output text)
        echo "Stack is at $URL"
        echo "URL=$URL" >> $GITHUB_ENV

    - name: Wait for the cluster to come up
      run: |
        for attempt in $(seq 1 90); do
          nodes=$(curl -fsS --max-time 10 "$URL/asyncdb/health" | jq '.nodes | length') || nodes=0
          if [ "${nodes:-0}" = "6" ]; then
            echo "Six nodes answering after $attempt attempts."
            exit 0
          fi
          echo "Attempt $attempt: ${nodes:-0} of 6 nodes."
          sleep 10
        done
        echo "The cluster did not reach six nodes."
        exit 1

    - name: Install newman
      run: npm install -g newman

    - name: Run the API collection
      run: |
        newman run api/asyncdb.postman_collection.json \
          -e api/asyncdb.aws.postman_environment.json \
          --env-var baseUrl=$URL/asyncdb \
          --env-var node1=$URL/asyncdb \
          --env-var node2=$URL/asyncdb \
          --env-var node3=$URL/asyncdb

    - name: Install the browser tests
      working-directory: automation
      run: |
        npm install
        npx playwright install --with-deps chromium

    - name: Run the browser tests
      working-directory: automation
      run: ASYNCDB_URL=$URL npm test

    - name: The report of a failed browser run
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: automation/playwright-report/
        retention-days: 7

    - name: Run the load tests
      env:
        THREADS: '8'
        REQUESTS: '250'
      run: |
        export BASE=$URL/asyncdb
        VALUE_BYTES=1024 perf/write.sh
        URL=$BASE/table/perf_load/key/0 perf/read.sh

    - name: The chaos role
      id: chaos_role
      if: steps.deploy.outputs.created == 'true'
      run: |
        make create-chaos-stack
        echo "created=true" >> $GITHUB_OUTPUT
        aws cloudformation wait stack-create-complete --stack-name asyncdb-chaos

    - name: Validate the experiment templates
      run: chaos/validate.sh

    - name: Run the chaos suite
      run: chaos/run.sh

    - name: Tear down the chaos role
      if: always() && steps.chaos_role.outputs.created == 'true'
      run: |
        make delete-chaos-stack
        aws cloudformation wait stack-delete-complete --stack-name asyncdb-chaos

    - name: Stack events
      if: failure() && steps.deploy.outputs.created == 'true'
      run: make describe-stack

    - name: What the nodes say for themselves
      if: failure() && steps.deploy.outputs.created == 'true'
      run: |
        set +e

        echo "The membership the load balancer answers with:"
        curl -fsS --max-time 10 "$URL/asyncdb/health" | jq .

        aws ec2 describe-instances \
          --filters "Name=tag:aws:cloudformation:stack-name,Values=asyncdb" \
                    "Name=instance-state-name,Values=running" \
          --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress,Placement.AvailabilityZone]' \
          --output text > instances.txt

        echo "The instances the stack is running:"
        cat instances.txt

        while read -r id ip zone; do
          [ -n "$id" ] || continue

          echo "::group::$id $ip $zone"

          command=$(aws ssm send-command \
            --instance-ids "$id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["docker ps -a","docker logs --tail 200 $(docker ps --format \"{{.ID}} {{.Image}}\" | awk \"/asyncdb/{print \\$1; exit}\") 2>&1"]' \
            --query 'Command.CommandId' --output text)

          if [ -n "$command" ]; then
            aws ssm wait command-executed --command-id "$command" --instance-id "$id" 2> /dev/null
            aws ssm get-command-invocation --command-id "$command" --instance-id "$id" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
          fi

          echo "--- console ---"
          aws ec2 get-console-output --instance-id "$id" --output text | tail -n 60

          echo "::endgroup::"
        done < instances.txt

        exit 0

    - name: Tear down the stack
      if: always() && steps.deploy.outputs.created == 'true'
      run: |
        make delete-stack
        aws cloudformation wait stack-delete-complete --stack-name asyncdb
