AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The permission to break the asyncdb stack. It is a stack of its own, created for a chaos run and
  deleted after it, because the permission to stop an instance and to run a shell command on one is
  not a thing to leave standing beside a database. Nothing else in the account grants either, so
  outside a chaos run nobody here can inject a fault.

Parameters:

  Operators:
    Type: CommaDelimitedList
    Default: builders
    Description: >-
      The IAM groups whose members run the suite. The operator policy is attached to these for as
      long as this stack stands, and the credentials the pipeline uses are in one of them.

Resources:

  ChaosPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Apply the faults chaos/ injects, and nothing else. Attached for as long as the chaos stack
        stands and no longer.
      Groups: !Ref Operators
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: FindWhatToBreak
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:DescribeNetworkAcls
              - ssm:DescribeInstanceInformation
              - ssm:ListCommandInvocations
              - ssm:GetCommandInvocation
              - autoscaling:DescribeAutoScalingGroups
            Resource: "*"

          - Sid: StopTheStackAndStartItAgain
            Effect: Allow
            Action:
              - ec2:StopInstances
              - ec2:StartInstances
            Resource: "*"
            Condition:
              StringEquals:
                ec2:ResourceTag/Name:
                  - asyncdb
                  - etcd

          - Sid: CutAZoneOff
            Effect: Allow
            Action:
              - ec2:CreateNetworkAcl
              - ec2:CreateNetworkAclEntry
              - ec2:DeleteNetworkAcl
              - ec2:ReplaceNetworkAclAssociation
              - ec2:CreateTags
            Resource: "*"

          - Sid: CarryAFaultOntoAnInstance
            Effect: Allow
            Action:
              - ssm:SendCommand
              - ssm:CancelCommand
            Resource: "*"

          - Sid: HoldTheEtcdGroupStill
            Effect: Allow
            Action:
              - autoscaling:SuspendProcesses
              - autoscaling:ResumeProcesses
            Resource: "*"

Outputs:

  ChaosPolicy:
    Description: The policy that lets the credentials running the suite inject a fault.
    Value: !Ref ChaosPolicy
